# psyneupre — site statique (single-page) servi par nginx, non-root, :8145.
# Pas de secret, pas de volume, pas d'état : tout est cuit dans l'image.
# Servi via l'edge Caddy (tailnet, psyneupre.jgsquare.io).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /dev/stdout;

  # Chemins temp sous /tmp pour un runtime non-root.
  client_body_temp_path /tmp/nginx-client;
  proxy_temp_path       /tmp/nginx-proxy;
  fastcgi_temp_path     /tmp/nginx-fastcgi;
  uwsgi_temp_path       /tmp/nginx-uwsgi;
  scgi_temp_path        /tmp/nginx-scgi;

  sendfile      on;
  tcp_nopush    on;
  gzip          on;
  gzip_types    text/plain text/css application/javascript image/svg+xml application/json;
  gzip_min_length 512;
  server_tokens off;

  server {
    listen 8145;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Derrière Caddy, nginx ne connaît ni le scheme ni le host public : ses
    # redirections auto doivent rester relatives, sinon il émet une adresse
    # interne (port 8145, HTTP) injoignable depuis le navigateur.
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Endpoint de santé pour le healthcheck compose / Caddy.
    location = /healthz {
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    # HTML : toujours frais (revalidé).
    location = /index.html { add_header Cache-Control "no-cache"; }

    # Page unique : tout ce qui n'est pas un fichier retombe sur index.html.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
